<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Student Manager</h1>
  <p id="error" class="error"></p>

  <form id="student-form">
    <input type="hidden" id="id">
    <label>Name <input type="text" id="name" required></label>
    <label>Email <input type="email" id="email" required></label>
    <label>Course <input type="text" id="course" required></label>
    <button type="submit" class="btn" id="save-btn">Add Student</button>
    <button type="button" class="btn secondary" id="cancel-btn" hidden>Cancel</button>
  </form>

  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script src="app.js"></script>
</body>
</html>
